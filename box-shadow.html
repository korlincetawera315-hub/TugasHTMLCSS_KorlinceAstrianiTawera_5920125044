<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box                                                                                                                                                                                                                                                                                                                                                               shadow</title>
</head>
<style>
   p.one {  
        -moz-box-shadow: -5px -5px #777777;  -webkit-box-shadow: -5px -5px #777777;  
        box-shadow: -5px -5px #777777;} 
    p.two {
        -moz-box-shadow: 5px 5px 5px #777777;  -webkit-box-shadow: 5px 5px 5px #777777; 
        box-shadow: 5px 5px 5px #777777;}   
    p.three {
        -moz-box-shadow: 5px 5px 5px 5px #777777;  -webkit-box-shadow: 5px 5px 5px 5px #777777; 
        box-shadow: 5px 5px 5px 5px #777777;}  
    p.four {
        -moz-box-shadow: 0 0 10px #777777;  -webkit-box-shadow: 0 0 10px #777777; 
        box-shadow: 0 0 10px #777777;} 
    p.five {
        -moz-box-shadow: inset 0 0 10px #777777;  -webkit-box-shadow: inset 0 0 10px #777777; 
        box-shadow: inset 0 0 10px #777777;} 
</style>
<body>
    <p class="one"><img src="box 1.jpeg.jpeg" alt=""></p>
    <p class="two"><img src="box 2.jpeg.jpeg" alt=""></p>
    <p class="three"><img src="box 3.jpeg.jpeg" alt=""></p>
    
    <p class="four"><img src="box 4.jpeg.jpeg" alt=""></p>
    <p class="five"><img src="box 5.jpeg.jpeg" alt=""></p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>styling fieldsets and legends</title>
</head>
<style>
  fieldset {
    width: 350px;
    border: 1px solid #dcdcdc;
    border-radius: 10px;
    padding: 20px;
    text-align: right;}
  legend {
    background-color: #efefef;
    border: 1px solid #dcdcdc;
    border-radius: 10px;
    padding: 10px 20px;
    text-align: left;
    text-transform: uppercase;} 
   p {
    text-align: left;
    margin: 15px 0 5px;}
   input {
    width: 250px;
    padding: 5px;
    margin-bottom: 10px;}
   button {
    background: #4b372b;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 15px;}
</style>
<body>
    <fieldset>
        <legend>NEWSLETTER</legend>
        <P>Name:</P>
        <input type="text">
        <p>Email:</p>
        <input type="email">
        <button>Subscribe</button>
    </fieldset>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/styling text inputs</title>
</head>
<style>
input { 
    font-size: 120%; 
    color: #5a5854; 
    background-color: #f2f2f2; 
    border: 1px solid #bdbdbd; 
    border-radius: 5px; 
    padding: 5px 5px 5px 30px; 
    background-repeat: no-repeat; 
    background-position: 8px 9px; 
    display: block; 
    margin-bottom: 10px;} 
input:focus {
    background-color: #ffffff; 
    border: 1px solid #b1e1e4;
    outline: none; }
input#email { 
    background-image: url("imagesemail.png.jpeg");
    background-size: 16px; }
input#twitter { 
    background-image: url("imagestwiteer.png.jpeg");
    background-size: 16px;} 
input#web {
    background-image: url("imagesweb.png.jpeg");
    background-size: 16px;}   
</style>
<body>
    <form>
        <input type="text" id="email" placeholder="Email">
        <input type="text" id="twitter" placeholder="twitter">
        <input type="text" id="web" placeholder="Website">
    </form>   
</body>
</html>

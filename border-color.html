<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border color</title>
</head>
<style>
   p.one {
    border-style: solid;
    border-color: #0088dd;}
   p.two {
    border-style: solid;
    border-color: #bbbbaa #111111 #ee3e80 #0088dd;} 
</style>

        1972.</p>
    <p class="two">The ARP Odyssey was introduced in 
        1972.</p>
</body>

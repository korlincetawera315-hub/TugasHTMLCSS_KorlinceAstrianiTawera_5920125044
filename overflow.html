<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>overflow</title>
</head>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f0f0f0;
        padding: 20ox;
    }
    .container {
        width: 400px;
    }

    .title {
        color: #0066cc;
        font-size: 24px;
        margin-bottom: 0px;
    }

    hr {
        border: 0;
        border-top: 1px solid #999;
        margin-top: 5px;
    }

    .description {
        color: #333;
        line-height: 1.4;
        font-size: 16px;
    }

    .scroll-box {
        height: 80px;
        overflow-y: scroll;
        border: 1px solid #ccc;
        padding: 5px;
        background-color: white;
    }
</style>
<body>
    <div class="container">
    <h1 class="title">fander stratocaster</h1>
    <hr>
    
    <p class="description">
       the fender stratocaster or "strat" is one of the most popular electric guitars of all time, and its design has been copied by many guitars makers.
    </p>
    <h1 class="title">gibson les paul</h1>
    <hr>
    <div class="scroll-box">
        the gibson les paul is a solid bodi electric guitar that was first solid in 1952. the les paul was designed by</p>
    </div>     
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fixed width layout</title>
</head>
<style>
   body {
        margin: 0;
        padding: 0;
        background: #d9d9d9;
        font-family:Arial, Helvetica, sans-serif;
    }
    .wrapper{
        width: 900px;
        margin: 30px auto;
        background: white;
        padding: 20px;
    }
    .logo {
        text-align: center;
        font-size: 55px;
        font-weight: bold;
        color: #4a2d39;
        margin-bottom: 30px;
    }
    .menu {
        width: 700px;
        margin: 0 auto 20px auto;
        background: #e5e5e5;
        padding: 18px;
        text-align: center;
        text-align: center;
    }
    .menu a{
        text-decoration: none;
        color: black;
        margin: 0 10px;
        font-size: 15px;
        text-align: center;
    }
    .feature {
        width: 700px;
        margin: 0 auto 20px auto;
        background: #e5e5e5;
        padding: 40px 0;
        text-align: center;
        color: #555;
        text-align: center;
       
    }
    .columns{
        width: 700px;
        margin: 0 auto 20px auto;
        overflow: hidden;
        text-align: center;
    }
    .colimn{
        width: 220px;
        float: left;
        background: #e5e5e5;
        padding: 20px 0;
        text-align: center;
        margin-right: 20px;
        color: #555;
        text-align: center;
    }
    .column:last-child{
        margin-right: 0;
        text-align: center;
    }
    .footer{
        width: 700px;
        margin: 0 auto;
        background: #ececec;
        padding: 20px;
        text-align: center;
        color: #555;
        clear: both;
        text-align: center;
    }
</style>
<body>
,
<div class="wrapper">
    <div class="logo">logo</div>
    
<div class="menu">
    <a href="#">home</a>
    <a href="#">products</a>
    <a href="#">services</a>
    <a href="#">about</a>
    <a href="#">contact</a>
</div>

<div class="feature">feature</div><div class="columns">column one</div><div class="columns">column two</div><div class="columns">column three</div>
</div>
<div class="footer">©copyright 2011</div>
</div>
</body>
</html>
